    <!--
      Three families, each doing one job.

      Space Grotesk carries the headings. It is a grotesque with the corners
      cut off rather than rounded, which is the same decision a machined part
      makes, and its single-storey g and flat-topped a give a page some voice
      without becoming a novelty face.

      Archivo carries the prose and the interface, because a display face at
      14 pixels is a display face nobody can read.

      JetBrains Mono is for figures and part numbers only, where a tabular,
      unmistakable 0 and 1 matter more than warmth.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    />
